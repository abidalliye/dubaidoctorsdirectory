<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HealthDir Admin | Find Doctor Dubai</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard-live.css" />
    <link rel="stylesheet" href="css/admin-dashboard.css" />
    <script src="js/auth-guard.js"></script>
    <script>
      AuthGuard.protect("admin");
    </script>
  </head>
  <body class="healthdir-admin">
    <aside class="dash-sidebar">
      <a class="hd-brand" href="index.html"
        ><span class="hd-logo">♥</span
        ><span>HealthDir<small>Doctors Directory</small></span></a
      >
      <nav class="sidebar-nav" aria-label="Dashboard navigation"></nav>
    </aside>
    <main class="dash-main">
      <header class="dash-header">
        <div class="hd-search">
          <span>⌕</span
          ><input
            id="ff-search"
            type="search"
            placeholder="Search doctors, clinics, hospitals, labs, bookings…"
            aria-label="Search dashboard records"
          />
          <div id="hd-search-results" class="hd-search-results" hidden></div>
        </div>
        <a class="hd-website" href="index.html" target="_blank" rel="noopener"
          >View Website ↗</a
        ><button
          id="hd-notifications"
          class="hd-bell"
          aria-label="Notifications"
        >
          ♧<span id="hd-unread">0</span></button
        ><button class="hd-account" id="hd-account">
          <span class="hd-avatar">A</span><span id="ff-name"></span
          ><span>⌄</span></button
        ><button id="ff-complete" hidden>Complete profile</button>
      </header>
      <div id="ff-message" role="status" class="ff-message" hidden></div>
      <div class="dash-content" id="ff-content"></div>
    </main>
    <script src="js/admin-dashboard.js"></script>
    <script src="js/account-ui.js"></script>
  </body>
</html>
