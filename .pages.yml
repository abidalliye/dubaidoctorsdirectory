# Pages CMS Configuration
# Documentation: https://pagescms.org/docs
# Central configuration for repository: abidalliye/dubaidoctorsdirectory

media:
  input: Images
  output: /Images
  categories: [image]

content:
  # ============================================================================
  # 1. DOCTORS DIRECTORY (Full Table View)
  # ============================================================================
  - name: doctors
    label: Doctors Directory
    type: collection
    path: _data/doctors
    format: json
    filename: "{fields.id}.json"
    view:
      fields: [name, specialty, category, clinic, area, dhaLicense, phone, consultationFee, rating, appointmentsCount, status]
      primary: name
      sort: [name, rating, appointmentsCount]
      search: [name, specialty, category, clinic, area, dhaLicense]
    fields:
      - name: id
        label: ""
        placeholder: "Doctor ID (e.g. DOC-001)"
        type: string
        required: true
      - name: name
        label: ""
        placeholder: "Doctor Full Name & Title (e.g. Dr. Ahmed Khan)"
        type: string
        required: true
      - name: specialty
        label: ""
        placeholder: "Medical Specialty (e.g. Cardiologist, Reproductive Endocrinologist)"
        type: string
        required: true
      - name: category
        label: ""
        placeholder: "Select Specialty Category"
        type: select
        options:
          values:
            - Cardiology
            - Dermatology
            - Orthopedics
            - Pediatrics
            - Gynecology
            - Reproductive Endocrinology
            - Urology
            - General Medicine
            - Others
      - name: clinic
        label: ""
        placeholder: "Affiliated Clinic or Hospital Name"
        type: string
      - name: area
        label: ""
        placeholder: "Dubai District / Neighborhood (e.g. Downtown Dubai, Jumeirah)"
        type: string
      - name: address
        label: ""
        placeholder: "Physical Practice Address"
        type: string
      - name: dhaLicense
        label: ""
        placeholder: "DHA Professional License (e.g. DHA-P-0019284)"
        type: string
      - name: phone
        label: ""
        placeholder: "Telephone (e.g. +971 4 377 5500)"
        type: string
      - name: whatsapp
        label: ""
        placeholder: "WhatsApp Number (e.g. +971 50 112 3344)"
        type: string
      - name: email
        label: ""
        placeholder: "Official Email Address"
        type: string
      - name: consultationFee
        label: ""
        placeholder: "Consultation Fee in AED (e.g. 550)"
        type: number
      - name: experience
        label: ""
        placeholder: "Years of Experience (e.g. 16 years)"
        type: string
      - name: languages
        label: ""
        placeholder: "Languages Spoken (e.g. English, Arabic, French)"
        type: string
      - name: education
        label: ""
        placeholder: "Education & Qualifications (e.g. MBBS, FRCOG)"
        type: string
      - name: rating
        label: ""
        placeholder: "Rating 0 - 5.0 (e.g. 4.9)"
        type: number
      - name: reviewsCount
        label: ""
        placeholder: "Total Patient Reviews"
        type: number
      - name: appointmentsCount
        label: ""
        placeholder: "Total Booked Appointments"
        type: number
      - name: status
        label: ""
        placeholder: "Select Verification Status"
        type: select
        options:
          values:
            - Active
            - Inactive
            - Pending Verification
      - name: avatar
        label: ""
        placeholder: "Avatar Emoji or Photo URL"
        type: string

  # ============================================================================
  # 2. CLINICS & HOSPITALS (Full Table View)
  # ============================================================================
  - name: clinics
    label: Clinics & Hospitals
    type: collection
    path: _data/clinics
    format: json
    filename: "{fields.id}.json"
    view:
      fields: [name, category, leadDoctor, area, dhaLicense, phone, plan, rating, status]
      primary: name
      sort: [name, rating, reviewsCount]
      search: [name, category, leadDoctor, area, dhaLicense]
    fields:
      - name: id
        label: ""
        placeholder: "Facility ID (e.g. CLI-001)"
        type: string
      - name: name
        label: ""
        placeholder: "Medical Facility Name (e.g. Orchid Fertility Clinic)"
        type: string
        required: true
      - name: category
        label: ""
        placeholder: "Select Facility Category"
        type: select
        options:
          values:
            - Clinic
            - Hospital
            - Diagnostic Lab
            - Fertility Centre
      - name: leadDoctor
        label: ""
        placeholder: "Medical Director or Lead Specialist"
        type: string
      - name: yearsInDubai
        label: ""
        placeholder: "Years Established in Dubai (e.g. 10 years)"
        type: string
      - name: accreditations
        label: ""
        placeholder: "Accreditations (e.g. DHA Licensed, JCI, CAP Laboratory)"
        type: string
      - name: area
        label: ""
        placeholder: "Dubai District (e.g. Dubai Healthcare City, Jumeirah)"
        type: string
      - name: address
        label: ""
        placeholder: "Full Physical Street Address & Building"
        type: string
      - name: parking
        label: ""
        placeholder: "Parking Access (e.g. Free Valet Parking, Basement)"
        type: string
      - name: dhaLicense
        label: ""
        placeholder: "DHA Facility License (e.g. DHA-F-0038912)"
        type: string
      - name: phone
        label: ""
        placeholder: "Telephone (e.g. +971 4 437 7520)"
        type: string
      - name: whatsapp
        label: ""
        placeholder: "Direct WhatsApp Line (e.g. +971 50 477 3832)"
        type: string
      - name: email
        label: ""
        placeholder: "Official Facility Email"
        type: string
      - name: website
        label: ""
        placeholder: "Official Website URL"
        type: string
      - name: services
        label: ""
        placeholder: "Services & Treatments Offered (Comma-separated)"
        type: string
      - name: fee
        label: ""
        placeholder: "Base Treatment or Consultation Fee (AED)"
        type: number
      - name: insurance
        label: ""
        placeholder: "Accepted Health Insurance Networks"
        type: string
      - name: plan
        label: ""
        placeholder: "Directory Subscription Plan"
        type: select
        options:
          values:
            - Verified Free Listing
            - Featured Specialist
            - Clinic Showcase
      - name: rating
        label: ""
        placeholder: "Rating 0 - 5.0"
        type: number
      - name: reviewsCount
        label: ""
        placeholder: "Total Verified Reviews"
        type: number
      - name: status
        label: ""
        placeholder: "Select Verification Status"
        type: select
        options:
          values:
            - Verified
            - Pending
            - Under Review

  # ============================================================================
  # 3. APPOINTMENTS QUEUE (Full Table View)
  # ============================================================================
  - name: appointments
    label: Appointments Queue
    type: collection
    path: _data/appointments
    format: json
    filename: "{fields.id}.json"
    view:
      fields: [patientName, doctorName, specialty, dateTime, timeSlot, phone, status]
      primary: patientName
      sort: [dateTime, patientName]
      search: [patientName, doctorName, specialty, phone, email]
    fields:
      - name: id
        label: ""
        placeholder: "Appointment ID (e.g. APT-1001)"
        type: string
      - name: patientName
        label: ""
        placeholder: "Patient Full Name"
        type: string
        required: true
      - name: doctorName
        label: ""
        placeholder: "Selected Doctor or Specialist"
        type: string
        required: true
      - name: specialty
        label: ""
        placeholder: "Medical Specialty or Department"
        type: string
      - name: service
        label: ""
        placeholder: "Requested Service or Consultation"
        type: string
      - name: dateTime
        label: ""
        placeholder: "Appointment Date (YYYY-MM-DD)"
        type: string
      - name: timeSlot
        label: ""
        placeholder: "Time Slot (e.g. 10:00 AM)"
        type: string
      - name: phone
        label: ""
        placeholder: "Patient Contact Phone / WhatsApp"
        type: string
      - name: email
        label: ""
        placeholder: "Patient Email Address"
        type: string
      - name: notes
        label: ""
        placeholder: "Medical Symptoms or Visit Notes"
        type: text
      - name: source
        label: ""
        placeholder: "Booking Channel (e.g. Online Directory, WhatsApp)"
        type: string
      - name: createdAt
        label: ""
        placeholder: "Booking Timestamp"
        type: string
      - name: status
        label: ""
        placeholder: "Select Appointment Status"
        type: select
        options:
          values:
            - Confirmed
            - Pending
            - Cancelled

  # ============================================================================
  # 4. PATIENTS REGISTRY (Full Table View)
  # ============================================================================
  - name: patients
    label: Patients Registry
    type: collection
    path: _data/patients
    format: json
    filename: "{fields.id}.json"
    view:
      fields: [name, phone, email, area, appointments, lastVisit, primaryDoctor, status]
      primary: name
      sort: [appointments, lastVisit]
      search: [name, phone, email, area]
    fields:
      - name: id
        label: ""
        placeholder: "Patient ID (e.g. PAT-001)"
        type: string
      - name: name
        label: ""
        placeholder: "Patient Full Name"
        type: string
        required: true
      - name: phone
        label: ""
        placeholder: "Contact Mobile Number"
        type: string
      - name: email
        label: ""
        placeholder: "Email Address"
        type: string
      - name: area
        label: ""
        placeholder: "Residential District in Dubai"
        type: string
      - name: appointments
        label: ""
        placeholder: "Total Appointments Count"
        type: number
      - name: lastVisit
        label: ""
        placeholder: "Date of Last Consultation"
        type: string
      - name: primaryDoctor
        label: ""
        placeholder: "Primary Preferred Physician"
        type: string
      - name: status
        label: ""
        placeholder: "Select Patient Status"
        type: select
        options:
          values:
            - Active
            - Follow-up Required
            - Discharged

  # ============================================================================
  # 5. PATIENT REVIEWS (Full Table View)
  # ============================================================================
  - name: reviews
    label: Patient Reviews
    type: collection
    path: _data/reviews
    format: json
    filename: "{fields.id}.json"
    view:
      fields: [patientName, doctorName, rating, treatment, date, verified]
      primary: patientName
      sort: [date, rating]
      search: [patientName, doctorName, treatment]
    fields:
      - name: id
        label: ""
        placeholder: "Review ID (e.g. REV-001)"
        type: string
      - name: patientName
        label: ""
        placeholder: "Reviewer Display Name"
        type: string
      - name: doctorName
        label: ""
        placeholder: "Doctor or Facility Name"
        type: string
      - name: rating
        label: ""
        placeholder: "Rating (1 to 5 Stars)"
        type: number
      - name: treatment
        label: ""
        placeholder: "Treatment or Procedure Received"
        type: string
      - name: comment
        label: ""
        placeholder: "Detailed Patient Feedback & Experience"
        type: text
      - name: date
        label: ""
        placeholder: "Date Posted (YYYY-MM-DD)"
        type: string
      - name: verified
        label: ""
        placeholder: "Verified Patient Status"
        type: boolean

  # ============================================================================
  # 6. BLOG ARTICLES (Full Table View)
  # ============================================================================
  - name: blogs
    label: Blog Articles
    type: collection
    path: _data/blogs
    format: json
    filename: "{fields.id}.json"
    view:
      fields: [title, author, category, publishedOn, views, status]
      primary: title
      sort: [publishedOn, views]
      search: [title, author, category]
    fields:
      - name: id
        label: ""
        placeholder: "Article Slug / ID"
        type: string
      - name: title
        label: ""
        placeholder: "Article Title"
        type: string
        required: true
      - name: description
        label: ""
        placeholder: "Short Meta Summary / Excerpt"
        type: text
      - name: author
        label: ""
        placeholder: "Author Name & Title"
        type: string
      - name: category
        label: ""
        placeholder: "Select Category"
        type: select
        options:
          values:
            - IVF & Fertility Guides
            - Doctor Spotlights
            - DHA Compliance
            - Medical Tourism
            - Patient Stories
      - name: publishedOn
        label: ""
        placeholder: "Published Date (YYYY-MM-DD)"
        type: string
      - name: readTime
        label: ""
        placeholder: "Reading Time (e.g. 5 min read)"
        type: string
      - name: views
        label: ""
        placeholder: "Total Views Count"
        type: number
      - name: status
        label: ""
        placeholder: "Select Publication Status"
        type: select
        options:
          values:
            - Published
            - Draft
            - Archived

  # ============================================================================
  # 7. EDITORIAL ARTICLES (Markdown WYSIWYG Collection)
  # ============================================================================
  - name: articles
    label: Editorial Articles (Markdown)
    type: collection
    path: content/articles
    format: yaml-frontmatter
    view:
      fields: [title, category, author, publishedOn]
      primary: title
      sort: [publishedOn]
      search: [title, author, category]
    fields:
      - name: title
        label: ""
        placeholder: "Editorial Article Title"
        type: string
        required: true
      - name: description
        label: ""
        placeholder: "Meta Description / Subtitle"
        type: text
      - name: publishedOn
        label: ""
        placeholder: "Published Date"
        type: date
      - name: author
        label: ""
        placeholder: "Author Name"
        type: string
      - name: category
        label: ""
        placeholder: "Select Editorial Category"
        type: select
        options:
          values:
            - IVF & Fertility Guides
            - Doctor Spotlights
            - DHA Compliance & Medical Law
            - Dubai Healthcare Tourism
            - Patient Case Studies
      - name: body
        label: ""
        placeholder: "Article Body Content (Markdown / Rich-Text)..."
        type: rich-text

  # ============================================================================
  # 8. PLATFORM SETTINGS (Single File)
  # ============================================================================
  - name: settings
    label: Platform Settings
    type: file
    path: _data/settings.json
    format: json
    fields:
      - name: siteName
        label: ""
        placeholder: "Site Brand Name"
        type: string
      - name: adminName
        label: ""
        placeholder: "Super Admin Display Name"
        type: string
      - name: adminEmail
        label: ""
        placeholder: "Admin Notification Email"
        type: string
      - name: contactPhone
        label: ""
        placeholder: "Support Telephone"
        type: string
      - name: defaultCurrency
        label: ""
        placeholder: "Default Currency (e.g. USD)"
        type: string
      - name: localCurrency
        label: ""
        placeholder: "Local Currency (e.g. AED)"
        type: string
      - name: firebaseProjectId
        label: ""
        placeholder: "Google Firebase Project ID"
        type: string
      - name: pagesCmsRepo
        label: ""
        placeholder: "GitHub Repository Path"
        type: string
