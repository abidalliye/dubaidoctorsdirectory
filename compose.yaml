services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: fertifind
      POSTGRES_USER: fertifind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      [
        "postgres:/var/lib/postgresql/data",
        "./infra/db:/docker-entrypoint-initdb.d:ro",
      ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fertifind"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports: ["127.0.0.1:6379:6379"]
  typesense:
    image: typesense/typesense:29.0
    command:
      [
        "--data-dir",
        "/data",
        "--api-key",
        "${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY}",
      ]
    ports: ["127.0.0.1:8108:8108"]
    volumes: ["typesense:/data"]
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgres://fertifind:${POSTGRES_PASSWORD}@db:5432/fertifind
      REDIS_URL: redis://redis:6379
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_HOST: typesense
      WEB_ORIGIN: http://localhost:3000
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      API_URL: http://api:4000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres:
  typesense:
