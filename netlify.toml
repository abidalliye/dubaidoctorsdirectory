[build]
  base = "."
  command = "npm run build:release"
  publish = "apps/web/.next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  WEB_ORIGIN = "https://fertifind-dubai.netlify.app"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@nestjs/common", "@nestjs/core", "@nestjs/platform-express", "pg", "ioredis", "typesense", "helmet", "reflect-metadata", "rxjs"]

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200
  force = true
